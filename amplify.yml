# Build de Amplify. Las variables VITE_* (Cognito, API Gateway) NO van aquí:
# las define Terraform en la rama de Amplify (módulo amplify de tienda-native-infra).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
